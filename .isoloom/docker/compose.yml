# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: google-ctf-2024-pycalc
services:
  challenge:
    build:
      context: ../../build/challenge
      labels:
        isoloom.managed: 'true'
        isoloom.environment: google-ctf-2024-pycalc
    image: isoloom/google-ctf-2024-pycalc-challenge
    platform: linux/amd64
    privileged: true
    hostname: challenge
    networks:
      lab:
        ipv4_address: 10.60.196.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+1337}:1337
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 1337
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.challenge: tcp:1337
      isoloom.managed: 'true'
      isoloom.environment: google-ctf-2024-pycalc
    restart: unless-stopped
  challenge-routes:
    image: alpine:3.20
    network_mode: service:challenge
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      challenge:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: google-ctf-2024-pycalc
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      challenge:
        condition: service_healthy
      challenge-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: google-ctf-2024-pycalc
  isoloom-check-challenge:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/challenge.sh:/isoloom/run.sh:ro
    network_mode: service:challenge
    depends_on:
      challenge:
        condition: service_healthy
      challenge-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: google-ctf-2024-pycalc
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: google-ctf-2024-pycalc
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.196.0/24
        gateway: 10.60.196.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: google-ctf-2024-pycalc
volumes:
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: google-ctf-2024-pycalc
