# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# PyCalc (Google's 2024 security competition, by Google; a misc challenge) as an Isoloom spec:
# a Python calculator that validates the bytecode of each expression and caches what it validated.
# The challenge folder 2024/quals/misc-pycalc of Google's challenge archive is vendored unchanged in build/challenge/app/ and built by the overlay Dockerfile next to it.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2024-pycalc

networks:
  lab: { cidr: 10.60.196.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    docker:
      build: build/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the calculator greets the player
    script: checks/probe.sh
    wait: 60

message: |
  PyCalc (Google, 2024) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  The calculator caches validated expressions by hash: can two expressions share one?
